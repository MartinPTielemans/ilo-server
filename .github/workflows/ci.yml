name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ilo
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d ilo"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install 1.99.1 --profile minimal -c clippy -c rustfmt && rustup default 1.99.1
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests on SQLite
        run: cargo test --locked
      - name: Tests on Postgres
        run: cargo test --locked
        env:
          ILO_TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/ilo

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ilo-server .
      - name: The image starts and answers /health
        run: |
          docker run -d --name server -e DEV_MODE=1 -p 8080:8080 ilo-server
          for _ in $(seq 30); do
            curl -fsS http://localhost:8080/health && exit 0
            sleep 1
          done
          docker logs server
          exit 1
