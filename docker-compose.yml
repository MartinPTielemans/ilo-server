# The server with Postgres. Copy .env.example to .env and fill it in, then:
#   docker compose up -d
services:
  server:
    build: .
    image: ilo-server
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgres://ilo:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db/ilo
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DEV_MODE: ${DEV_MODE:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ilo
      POSTGRES_DB: ilo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # Postgres 18's image keeps its data under this folder, one level up from older images'.
      - db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "ilo", "-d", "ilo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db:
