<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no">
<title>Your ilo sign-in code</title>
<style>
:root { color-scheme: light dark; supported-color-schemes: light dark; }
a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
@media (prefers-color-scheme: dark) {
  body, .page { background: #16140F !important; }
  .ink { color: #F3F0E8 !important; }
  .quiet { color: #9B9891 !important; }
  .mark-light { display: none !important; }
  .mark-dark { display: block !important; }
}
[data-ogsc] .mark-light { display: none !important; }
[data-ogsc] .mark-dark { display: block !important; }
</style>
<!--[if mso]><style>td { font-family: 'Segoe UI', sans-serif !important; }</style><![endif]-->
</head>
<body class="page" style="margin:0;padding:0;background:#F3F0E8;">
<table role="presentation" class="page" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#F3F0E8;">
<tr><td align="center" style="padding:48px 24px;">
<!--[if mso]><table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0"><tr><td><![endif]-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',sans-serif;">
<tr><td style="padding:0 0 40px;">
<img class="mark-light" src="cid:wordmark" width="40" height="28" alt="ilo" style="display:block;border:0;outline:none;color:#16140F;font:600 22px/28px -apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',sans-serif;">
<!--[if !mso]><!--><img class="mark-dark" src="cid:wordmark-dark" width="40" height="28" alt="ilo" style="display:none;mso-hide:all;border:0;outline:none;color:#F3F0E8;font:600 22px/28px -apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',sans-serif;"><!--<![endif]-->
</td></tr>
<tr><td class="ink" style="padding:0 0 8px;font-size:15px;line-height:22px;font-weight:500;color:#16140F;">Your sign-in code</td></tr>
<tr><td class="ink" style="padding:0 0 28px;font-size:40px;line-height:48px;font-weight:600;letter-spacing:0.12em;font-variant-numeric:tabular-nums;font-feature-settings:'tnum';color:#16140F;">{code}</td></tr>
<tr><td class="quiet" style="padding:0;font-size:14px;line-height:21px;color:#6E6C66;">It works for 10 minutes. If you didn't try to sign in, you can ignore this mail.</td></tr>
<tr><td class="quiet" style="padding:56px 0 0;font-size:12px;line-height:18px;color:#6E6C66;">ilo &middot; a good tool.<br>{host}</td></tr>
</table>
<!--[if mso]></td></tr></table><![endif]-->
</td></tr>
</table>

</html>
